description: >
  Add the Sun as the pipeline's sole packaged override. The origin coordinates
  are synthetic dataset conventions, while the render photometry and
  temperature are pinned to the cited published standards below.

stars:
  - override_id: manual.sun.add.v1
    action: add
    source: manual
    source_id: sun
    override_reason: synthetic_origin_star
    override_policy_version: sun_origin_willmer2018_iau2015_v2

    # Synthetic dataset convention: the Sun defines the Cartesian origin.
    # RA/Dec are fixed fallbacks used only for deterministic 2D sharding.
    ra_deg: 0.0
    dec_deg: 0.0
    r_pc: 0.0

    x_icrs_pc: 0.0
    y_icrs_pc: 0.0
    z_icrs_pc: 0.0

    mag_abs: 4.81
    mag_band: Johnson_V
    mag_system: vegamag
    teff: 5772

    identifiers:
      proper_name: Sol

    provenance:
      schema_version: 1
      astrometry:
        value_kind: synthetic_dataset_convention
        description: >
          The Sun defines the Sun-centered ICRS Cartesian origin. Its zero
          distance and fallback RA/Dec are not observational measurements.
      absolute_magnitude:
        field: mag_abs
        value: 4.81
        bandpass: Johnson_V
        magnitude_system: vegamag
        source:
          authors: "Willmer, C. N. A."
          year: 2018
          title: "The Absolute Magnitude of the Sun in Several Filters"
          journal: "The Astrophysical Journal Supplement Series"
          volume: 236
          article: 47
          doi: "10.3847/1538-4365/aabfdf"
          arxiv: "1804.07788"
      effective_temperature:
        field: teff
        value: 5772
        unit: K
        value_kind: nominal_exact_conversion_constant
        standard: "IAU 2015 Resolution B3"
        source:
          authors: "Prša et al."
          year: 2016
          title: >
            Nominal values for selected solar and planetary quantities:
            IAU 2015 Resolution B3
          journal: "The Astronomical Journal"
          volume: 152
          article: 41
          doi: "10.3847/0004-6256/152/2/41"
          arxiv: "1605.09788"

    notes: >
      The astrometric coordinates (ra_deg/dec_deg/r_pc and x/y/z) are manual
      deterministic catalogue conventions for a synthetic origin object used by
      this pipeline, not observationally measured solar astrometry. mag_abs is
      Willmer's Johnson V vegamag value. teff is the exact nominal solar
      effective-temperature conversion constant adopted by IAU 2015 Resolution
      B3, not a claim that the physical Sun has an uncertainty-free temperature.
